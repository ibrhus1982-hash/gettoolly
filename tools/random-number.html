<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Random Number Generator - Free Online Tool | GetToolly</title>

  <meta name="description"
    content="Generate random numbers instantly with the free GetToolly Random Number Generator.">

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <header class="header">

    <div class="container nav">

      <a href="../index.html" class="logo">
        GetToolly
      </a>

      <nav class="navigation">
        <a href="../index.html">Home</a>
        <a href="../index.html#tools">Tools</a>
        <a href="../privacy.html">Privacy</a>
      </nav>

    </div>

  </header>


  <main>

    <section class="tools-section">

      <div class="container">

        <div class="tool-card">

          <a href="../index.html#tools">
            ← Back to Tools
          </a>

          <br><br>

          <h1>Random Number Generator</h1>

          <p>
            Generate one or more random numbers between any minimum
            and maximum values.
          </p>

          <br>

          <label for="min">
            Minimum
          </label>

          <input
            id="min"
            type="number"
            value="1"
            style="
              width:100%;
              padding:14px;
              border:1px solid #ddd;
              border-radius:10px;
              font-size:16px;
              margin-top:8px;
            "
          >

          <br><br>

          <label for="max">
            Maximum
          </label>

          <input
            id="max"
            type="number"
            value="100"
            style="
              width:100%;
              padding:14px;
              border:1px solid #ddd;
              border-radius:10px;
              font-size:16px;
              margin-top:8px;
            "
          >

          <br><br>

          <label for="count">
            Number of Results
          </label>

          <input
            id="count"
            type="number"
            value="1"
            min="1"
            max="100"
            style="
              width:100%;
              padding:14px;
              border:1px solid #ddd;
              border-radius:10px;
              font-size:16px;
              margin-top:8px;
            "
          >

          <br><br>

          <button
            class="button"
            onclick="generateNumbers()"
            style="
              border:0;
              cursor:pointer;
            "
          >
            Generate Numbers
          </button>

          <div
            id="result"
            style="
              margin-top:20px;
              padding:20px;
              background:#f5f7fa;
              border-radius:10px;
              font-size:22px;
              font-weight:bold;
              word-break:break-word;
            "
          >
            Your random number will appear here.
          </div>

        </div>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <div class="footer-logo">
        GetToolly
      </div>

      <div class="footer-links">
        <a href="../index.html">Home</a>
        <a href="../privacy.html">Privacy Policy</a>
        <a href="../terms.html">Terms</a>
      </div>

      <p class="copyright">
        © 2026 GetToolly. All rights reserved.
      </p>

    </div>

  </footer>


  <script>

    function randomInteger(min, max) {

      return Math.floor(
        Math.random() *
        (max - min + 1)
      ) + min;

    }


    function generateNumbers() {

      const min =
        Number(
          document.getElementById("min").value
        );

      const max =
        Number(
          document.getElementById("max").value
        );

      const count =
        Number(
          document.getElementById("count").value
        );

      const result =
        document.getElementById("result");


      if (
        !Number.isFinite(min) ||
        !Number.isFinite(max) ||
        !Number.isFinite(count)
      ) {

        result.textContent =
          "Please enter valid numbers.";

        return;

      }


      if (min > max) {

        result.textContent =
          "Minimum cannot be greater than maximum.";

        return;

      }


      if (
        count < 1 ||
        count > 100
      ) {

        result.textContent =
          "Number of results must be between 1 and 100.";

        return;

      }


      const numbers = [];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        numbers.push(
          randomInteger(min, max)
        );

      }


      result.textContent =
        numbers.join(", ");

    }

  </script>

</body>

</html>
