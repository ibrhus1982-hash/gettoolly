<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Generator - Free Online Tool | GetToolly</title>

  <meta name="description"
    content="Generate strong random passwords with the free GetToolly Password Generator.">

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <header class="header">

    <div class="container nav">

      <a href="../index.html" class="logo">
        GetToolly
      </a>

      <nav class="navigation">
        <a href="../index.html">Home</a>
        <a href="../index.html#tools">Tools</a>
        <a href="../privacy.html">Privacy</a>
      </nav>

    </div>

  </header>


  <main>

    <section class="tools-section">

      <div class="container">

        <div class="tool-card">

          <a href="../index.html#tools">
            ← Back to Tools
          </a>

          <br><br>

          <h1>Free Password Generator</h1>

          <p>
            Create strong random passwords directly in your browser.
            Your generated password is not sent to our server.
          </p>

          <br>

          <label for="length">
            Password Length
          </label>

          <input
            id="length"
            type="number"
            min="6"
            max="64"
            value="16"
            style="
              width:100%;
              padding:14px;
              border:1px solid #ddd;
              border-radius:10px;
              font-size:16px;
              margin-top:8px;
            "
          >

          <br><br>

          <label>
            <input
              type="checkbox"
              id="uppercase"
              checked
            >
            Include uppercase letters
          </label>

          <br>

          <label>
            <input
              type="checkbox"
              id="lowercase"
              checked
            >
            Include lowercase letters
          </label>

          <br>

          <label>
            <input
              type="checkbox"
              id="numbers"
              checked
            >
            Include numbers
          </label>

          <br>

          <label>
            <input
              type="checkbox"
              id="symbols"
              checked
            >
            Include symbols
          </label>

          <br><br>

          <button
            class="button"
            onclick="generatePassword()"
            style="
              border:0;
              cursor:pointer;
            "
          >
            Generate Password
          </button>

          <br><br>

          <input
            id="password"
            type="text"
            readonly
            placeholder="Your password will appear here"
            style="
              width:100%;
              padding:15px;
              border:1px solid #ddd;
              border-radius:10px;
              font-size:18px;
            "
          >

          <br><br>

          <button
            onclick="copyPassword()"
            style="
              padding:12px 20px;
              border:1px solid #ddd;
              border-radius:10px;
              background:white;
              cursor:pointer;
              font-weight:bold;
            "
          >
            Copy Password
          </button>

          <span
            id="message"
            style="margin-left:10px;"
          ></span>

        </div>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <div class="footer-logo">
        GetToolly
      </div>

      <div class="footer-links">

        <a href="../index.html">
          Home
        </a>

        <a href="../privacy.html">
          Privacy Policy
        </a>

        <a href="../terms.html">
          Terms
        </a>

      </div>

      <p class="copyright">
        © 2026 GetToolly. All rights reserved.
      </p>

    </div>

  </footer>


  <script>

    function generatePassword() {

      const length =
        Math.min(
          64,
          Math.max(
            6,
            Number(
              document.getElementById("length").value
            )
          )
        );


      let characters = "";

      const uppercase =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      const lowercase =
        "abcdefghijklmnopqrstuvwxyz";

      const numbers =
        "0123456789";

      const symbols =
        "!@#$%^&*()-_=+[]{}";


      if (
        document.getElementById("uppercase").checked
      ) {
        characters += uppercase;
      }


      if (
        document.getElementById("lowercase").checked
      ) {
        characters += lowercase;
      }


      if (
        document.getElementById("numbers").checked
      ) {
        characters += numbers;
      }


      if (
        document.getElementById("symbols").checked
      ) {
        characters += symbols;
      }


      if (characters === "") {

        alert(
          "Please select at least one character type."
        );

        return;

      }


      let password = "";


      const randomValues =
        new Uint32Array(length);

      crypto.getRandomValues(
        randomValues
      );


      for (
        let i = 0;
        i < length;
        i++
      ) {

        password +=
          characters[
            randomValues[i] %
            characters.length
          ];

      }


      document.getElementById("password").value =
        password;

    }


    function copyPassword() {

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");


      if (password === "") {

        message.textContent =
          "Generate a password first.";

        return;

      }


      navigator.clipboard.writeText(
        password
      );


      message.textContent =
        "Copied!";


      setTimeout(function() {

        message.textContent = "";

      }, 2000);

    }


    generatePassword();

  </script>

</body>

</html>
