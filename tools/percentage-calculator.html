        button {
            background: #2563eb;

<body>

<header>
    <h1>Percentage Calculator</h1>
    <p>Calculate percentages quickly and easily</p>
</header>

<nav>
    <a href="../index.html">Home</a>
    <a href="../index.html#tools">All Tools</a>
</nav>

<div class="container">

    <div class="tool-card">

        <h2>Percentage Calculator</h2>

        <!-- What is X% of Y -->
        <div class="calculator-section">
            <h3>What is X% of Y?</h3>

            <label for="percent1">Percentage (%)</label>
            <input type="number" id="percent1" placeholder="Example: 20">

            <label for="number1">Number</label>
            <input type="number" id="number1" placeholder="Example: 150">

            <button onclick="calculatePercentage()">Calculate</button>

            <div class="result" id="result1"></div>
        </div>

        <!-- X is what percent of Y -->
        <div class="calculator-section">
            <h3>X is what percent of Y?</h3>

            <label for="number2">X</label>
            <input type="number" id="number2" placeholder="Example: 30">

            <label for="number3">Y</label>
            <input type="number" id="number3" placeholder="Example: 150">

            <button onclick="calculateWhatPercent()">Calculate</button>

            <div class="result" id="result2"></div>
        </div>

        <!-- Percentage Increase / Decrease -->
        <div class="calculator-section">
            <h3>Percentage Increase / Decrease</h3>

            <label for="oldValue">Original Value</label>
            <input type="number" id="oldValue" placeholder="Example: 100">

            <label for="newValue">New Value</label>
            <input type="number" id="newValue" placeholder="Example: 120">

            <button onclick="calculateChange()">Calculate</button>

            <div class="result" id="result3"></div>
        </div>

        <a href="../index.html" class="back-link">← Back to GetToolly</a>

    </div>

</div>

<footer>
    <p>© 2026 GetToolly. All rights reserved.</p>

    <p>
        <a href="../about.html">About</a>
        <a href="../privacy.html">Privacy Policy</a>

        <a href="../contact.html">Contact</a>
    </p>
</footer>

<script>

function calculatePercentage() {

    const percentage = parseFloat(
        document.getElementById("percent1").value
    );

    const number = parseFloat(
        document.getElementById("number1").value
    );

    const result = document.getElementById("result1");

    if (isNaN(percentage) || isNaN(number)) {
        result.style.display = "block";
        result.textContent = "Please enter valid numbers.";
        return;
    }

    const answer = (percentage / 100) * number;

    result.style.display = "block";
    result.textContent =
        percentage + "% of " + number + " = " + answer;
}


function calculateWhatPercent() {

    const x = parseFloat(
        document.getElementById("number2").value
    );

    const y = parseFloat(
        document.getElementById("number3").value
    );

    const result = document.getElementById("result2");

    if (isNaN(x) || isNaN(y) || y === 0) {
        result.style.display = "block";
        result.textContent = "Please enter valid numbers.";
        return;
    }

    const answer = (x / y) * 100;

    result.style.display = "block";
    result.textContent =
        x + " is " + answer.toFixed(2) + "% of " + y;
}


function calculateChange() {

    const oldValue = parseFloat(
        document.getElementById("oldValue").value
    );

    const newValue = parseFloat(
        document.getElementById("newValue").value
    );

    const result = document.getElementById("result3");

    if (isNaN(oldValue) || isNaN(newValue) || oldValue === 0) {
        result.style.display = "block";
        result.textContent = "Please enter valid numbers.";
        return;
    }

    const change =
        ((newValue - oldValue) / oldValue) * 100;

    result.style.display = "block";

    if (change > 0) {
        result.textContent =
            "Percentage increase: " + change.toFixed(2) + "%";
    } else if (change < 0) {
        result.textContent =
            "Percentage decrease: " + Math.abs(change).toFixed(2) + "%";
    } else {
        result.textContent =
            "There is no percentage change.";
    }
}

</script>

</body>
