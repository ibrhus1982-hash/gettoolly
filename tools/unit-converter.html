<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unit Converter - Free Online Tool | GetToolly</title>

  <meta name="description"
    content="Convert length, weight and temperature units quickly with the free GetToolly Unit Converter.">

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <header class="header">
    <div class="container nav">

      <a href="../index.html" class="logo">
        GetToolly
      </a>

      <nav class="navigation">
        <a href="../index.html">Home</a>
        <a href="../index.html#tools">Tools</a>
        <a href="../privacy.html">Privacy</a>
      </nav>

    </div>
  </header>


  <main>

    <section class="tools-section">

      <div class="container">

        <div class="tool-card">

          <a href="../index.html#tools">
            ← Back to Tools
          </a>

          <br><br>

          <h1>Free Unit Converter</h1>

          <p>
            Convert common length, weight and temperature units.
          </p>

          <br>

          <label for="category">
            Category
          </label>

          <select id="category" onchange="updateUnits()"
            style="width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-top:8px;">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temperature">Temperature</option>
          </select>

          <br><br>

          <input
            id="value"
            type="number"
            placeholder="Enter value"
            style="width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;"
          >

          <br><br>

          <label>
            From
          </label>

          <select
            id="from"
            style="width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-top:8px;"
          ></select>

          <br><br>

          <label>
            To
          </label>

          <select
            id="to"
            style="width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-top:8px;"
          ></select>

          <br><br>

          <button
            class="button"
            onclick="convert()"
            style="border:0;cursor:pointer;"
          >
            Convert
          </button>

          <div
            id="result"
            style="
              margin-top:20px;
              padding:20px;
              background:#f5f7fa;
              border-radius:10px;
              font-size:20px;
              font-weight:bold;
            "
          >
            Result will appear here.
          </div>

        </div>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <div class="footer-logo">
        GetToolly
      </div>

      <div class="footer-links">
        <a href="../index.html">Home</a>
        <a href="../privacy.html">Privacy Policy</a>
        <a href="../terms.html">Terms</a>
      </div>

      <p class="copyright">
        © 2026 GetToolly. All rights reserved.
      </p>

    </div>

  </footer>


  <script>

    const units = {

      length: {
        meter: 1,
        kilometer: 1000,
        centimeter: 0.01,
        millimeter: 0.001,
        mile: 1609.344,
        yard: 0.9144,
        foot: 0.3048,
        inch: 0.0254
      },

      weight: {
        kilogram: 1,
        gram: 0.001,
        milligram: 0.000001,
        pound: 0.45359237,
        ounce: 0.0283495231
      }

    };


    function updateUnits() {

      const category =
        document.getElementById("category").value;

      const from =
        document.getElementById("from");

      const to =
        document.getElementById("to");


      from.innerHTML = "";
      to.innerHTML = "";


      if (category === "temperature") {

        const temperatureUnits = [
          "celsius",
          "fahrenheit",
          "kelvin"
        ];


        temperatureUnits.forEach(function(unit) {

          from.add(
            new Option(unit, unit)
          );

          to.add(
            new Option(unit, unit)
          );

        });

        return;

      }


      Object.keys(
        units[category]
      ).forEach(function(unit) {

        from.add(
          new Option(unit, unit)
        );

        to.add(
          new Option(unit, unit)
        );

      });

    }


    function convertTemperature(
      value,
      from,
      to
    ) {

      let celsius;


      if (from === "celsius") {

        celsius = value;

      } else if (from === "fahrenheit") {

        celsius =
          (value - 32) * 5 / 9;

      } else {

        celsius =
          value - 273.15;

      }


      if (to === "celsius") {

        return celsius;

      }


      if (to === "fahrenheit") {

        return (
          celsius * 9 / 5
        ) + 32;

      }


      return celsius + 273.15;

    }


    function convert() {

      const value =
        Number(
          document.getElementById("value").value
        );

      const category =
        document.getElementById("category").value;

      const from =
        document.getElementById("from").value;

      const to =
        document.getElementById("to").value;

      const result =
        document.getElementById("result");


      if (!Number.isFinite(value)) {

        result.textContent =
          "Please enter a valid number.";

        return;

      }


      let answer;


      if (category === "temperature") {

        answer =
          convertTemperature(
            value,
            from,
            to
          );

      } else {

        answer =
          value *
          units[category][from] /
          units[category][to];

      }


      result.textContent =
        value +
        " " +
        from +
        " = " +
        answer.toFixed(6) +
        " " +
        to;

    }


    updateUnits();

  </script>

</body>

</html>
